<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>MoBox UXI</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="mobile-toggle" id="leftToggle" aria-label="Open workspaces">☰</button>
      <div class="brand">MOBOX UXI</div>
      <span class="badge">truthful local-first operator</span>
      <div class="pulse" id="pulse">connecting…</div>
      <button class="mobile-toggle" id="rightToggle" aria-label="Open context">Context</button>
    </header>

    <aside class="panel left" aria-label="Workspaces">
      <div class="panel-section"><button class="primary-button" id="newSession">+ New workspace</button></div>
      <h2>Sessions</h2><div class="panel-section" id="sessions"></div>
      <h2>Repositories</h2><div class="panel-section" id="repos"></div>
    </aside>

    <main class="main">
      <div class="stream" id="stream"></div>
      <div class="composer">
        <form id="composer">
          <input id="message" autocomplete="off" placeholder="Ask Aetherion, /inspect AIFT-OS, or /forge">
          <button type="submit">Send</button>
        </form>
      </div>
    </main>

    <aside class="panel right" aria-label="Context and governance">
      <h2>System context</h2><div class="detail" id="system">Loading…</div>
      <h2>Evidence</h2><div class="detail" id="evidence">Select a repository or inspect it in conversation.</div>
      <h2>Governance</h2><div class="detail" id="governance">Read-only adapters create supervised jobs and evidence artifacts.</div>

      <form class="governance-form" id="planForm">
        <strong>Propose plan</strong>
        <label>Objective<input id="planObjective" required></label>
        <label>Steps, one per line<textarea id="planSteps" required></textarea></label>
        <button type="submit">Record proposed plan</button>
      </form>

      <form class="governance-form" id="actionForm">
        <strong>Propose action</strong>
        <label>Kind<select id="actionKind" required></select></label>
        <label>Target<input id="actionTarget" list="actionTargets" placeholder="AIFT-Forge or booksmith.library" required></label>
        <datalist id="actionTargets"></datalist>
        <label>Risk<select id="actionRisk"><option>low</option><option>moderate</option><option>high</option><option>critical</option></select></label>
        <label class="checkbox-row"><input type="checkbox" id="actionApproval" checked> Require approval</label>
        <button type="submit">Record action proposal</button>
      </form>
    </aside>
  </div>
  <div class="overlay" id="overlay"></div>
</body>
</html>
