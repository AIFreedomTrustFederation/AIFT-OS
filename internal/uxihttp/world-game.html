<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020914">
  <title>Federation World</title>
  <style>
    :root{color-scheme:dark;--cyan:#55eadb;--blue:#57a9ff;--gold:#f2cb73;--good:#a7ef7b;--warn:#f2be58;--bad:#ff8c8c;--muted:#91a5bd}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;color:#eef7ff;font-family:Inter,system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:-25%;background:radial-gradient(circle at 50% 48%,rgba(23,91,139,.28),transparent 35%),radial-gradient(circle at 20% 20%,rgba(39,219,205,.09),transparent 28%),linear-gradient(160deg,#061527,#020913 58%,#02070d);animation:tide 11s ease-in-out infinite alternate;pointer-events:none}
    @keyframes tide{to{transform:scale(1.04) rotate(.4deg);filter:saturate(1.2)}}
    #scene{position:fixed;inset:0;width:100%;height:100%;z-index:1;cursor:grab}
    #scene.dragging{cursor:grabbing}
    .grid{stroke:#5f8cab;stroke-width:.55;opacity:.17}.equator{stroke:#7bb7d6;stroke-width:1;opacity:.34;stroke-dasharray:6 7}.land{fill:#132a39;stroke:#52778b;stroke-width:1;opacity:.92;filter:drop-shadow(0 7px 15px rgba(0,0,0,.32))}.ice{fill:#304451;opacity:.8}
    .route{fill:none;stroke:var(--cyan);stroke-width:1.25;opacity:.38;stroke-dasharray:5 6;animation:flow 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}
    .marker{cursor:pointer;outline:none}.marker circle{transform-box:fill-box;transform-origin:center;transition:.16s}.marker:hover circle,.marker:focus circle,.marker.selected circle{transform:scale(1.18);filter:drop-shadow(0 0 10px currentColor)}.marker.ready{color:var(--good)}.marker.detected{color:var(--warn)}.marker.blocked{color:var(--bad)}.marker.device{color:var(--cyan)}
    .marker text{fill:#f1f8ff;text-anchor:middle;font-size:8px;font-weight:800;paint-order:stroke;stroke:#020914;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.marker .meta{fill:#9ab0c6;font-size:6px}.device-ring{fill:none;stroke:var(--cyan);stroke-width:1.1;animation:ping 2.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(2.5);opacity:0}}
    .hud{position:fixed;z-index:10;pointer-events:none}.hud>*{pointer-events:auto}
    .top-left{left:max(16px,env(safe-area-inset-left));top:max(15px,env(safe-area-inset-top))}.sigil{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8ea9c0}.title{margin-top:2px;font-size:clamp(21px,5vw,35px);font-weight:900;letter-spacing:-.045em;color:#dff3ff;text-shadow:0 0 30px rgba(85,234,219,.2)}
    .top-center{left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%)}.world-progress{display:flex;align-items:center;gap:10px}.level-orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#123d49,rgba(6,17,29,.3) 67%,transparent);box-shadow:0 0 25px rgba(85,234,219,.15);text-align:center}.level-orb strong{display:block;color:var(--cyan);font-size:17px}.level-orb small{display:block;color:#78a6aa;font-size:6px;letter-spacing:.16em}.xp strong{display:block;font-size:10px;color:#e2f7ff}.xp span{display:block;font-size:8px;color:var(--muted)}.xp-track{height:3px;margin-top:5px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}.xp-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue),#a684ff);box-shadow:0 0 8px var(--cyan)}
    .top-right{right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px}.icon{width:43px;height:43px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(7,16,28,.46);backdrop-filter:blur(12px);color:#ddecfa;font-size:18px;box-shadow:0 10px 25px rgba(0,0,0,.23)}.icon:active{transform:scale(.94)}
    .gps{left:max(14px,env(safe-area-inset-left));bottom:max(15px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:7px}.gps-button{border:0;border-radius:999px;padding:10px 14px;background:rgba(8,33,37,.62);backdrop-filter:blur(14px);color:#c7fff4;font-weight:900;font-size:10px;box-shadow:0 14px 35px rgba(0,0,0,.26)}.gps-button.active{background:rgba(10,70,66,.7);box-shadow:0 0 25px rgba(85,234,219,.15)}.precision{border:0;border-radius:999px;padding:9px 11px;background:rgba(8,16,28,.55);backdrop-filter:blur(14px);color:#a9bbce;font-size:9px;outline:0}.forget{border:0;border-radius:50%;width:36px;height:36px;background:rgba(45,17,24,.54);color:#ffc3c8;font-size:15px}
    .quest-button{right:max(14px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:9px 13px 9px 10px;background:rgba(7,16,28,.58);backdrop-filter:blur(14px);color:#eaf5ff;max-width:48vw;text-align:left;box-shadow:0 15px 35px rgba(0,0,0,.25)}.quest-rune{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#173f4e,#08121a);color:var(--cyan);flex:0 0 auto}.quest-button strong{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quest-button span{display:block;font-size:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{position:fixed;z-index:9;left:50%;bottom:max(72px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);color:#8ca8bd;font-size:8px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 8px #020914}
    .sheet{position:fixed;z-index:20;left:50%;bottom:0;width:min(650px,100%);transform:translate(-50%,105%);transition:transform .24s ease;padding:28px max(20px,env(safe-area-inset-left)) max(24px,calc(env(safe-area-inset-bottom) + 18px));background:linear-gradient(180deg,rgba(4,12,21,.03),rgba(4,12,21,.95) 23%);backdrop-filter:blur(18px);pointer-events:none}.sheet.open{transform:translate(-50%,0);pointer-events:auto}.sheet-grip{width:44px;height:3px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 16px}.sheet-close{position:absolute;right:17px;top:20px;border:0;background:transparent;color:#91a5ba;font-size:23px}.sheet h2{margin:0;color:#dff5ff;font-size:25px;line-height:1}.sheet .role{margin-top:6px;color:var(--cyan);font-size:9px;letter-spacing:.14em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat small{display:block;color:#768ba4;font-size:8px;text-transform:uppercase}.stat strong{display:block;margin-top:2px;color:#ecf5ff;font-size:14px}.repo-list{display:grid;gap:5px;max-height:180px;overflow:auto}.repo{padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.055);font-size:9px;color:#aebfd1}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions a,.sheet-actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:10px;background:rgba(85,234,219,.12);color:#c2f7ef;font-weight:800;font-size:10px}
    .toast{position:fixed;z-index:30;left:50%;top:18%;transform:translate(-50%,-10px);opacity:0;transition:.2s;padding:9px 14px;border-radius:999px;background:rgba(7,16,27,.74);backdrop-filter:blur(12px);color:#dceaff;font-size:10px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:650px){.top-center{top:max(74px,calc(env(safe-area-inset-top) + 60px))}.top-left .title{font-size:18px}.top-left .sigil{font-size:7px}.top-right{gap:4px}.icon{width:39px;height:39px}.gps{left:10px;right:10px;bottom:max(63px,calc(env(safe-area-inset-bottom) + 48px));justify-content:center}.gps-button{padding:9px 11px}.quest-button{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:none}.status{bottom:max(112px,calc(env(safe-area-inset-bottom) + 98px))}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <svg id="scene" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice" aria-label="Interactive Federation World Map">
    <g id="camera">
      <g id="grid"></g>
      <g aria-hidden="true">
        <path class="land" d="M42 95 L76 66 L125 50 L177 58 L218 82 L253 117 L275 146 L260 171 L225 177 L204 204 L169 202 L146 227 L112 211 L89 181 L57 162 Z"/>
        <path class="land" d="M220 183 L252 194 L276 229 L285 271 L270 314 L253 354 L229 395 L207 367 L197 321 L187 277 L192 231 Z"/>
        <path class="land" d="M425 79 L473 63 L525 67 L560 84 L605 73 L652 78 L697 91 L744 88 L790 102 L836 126 L869 151 L851 178 L808 178 L781 199 L735 190 L704 208 L661 197 L621 207 L584 186 L546 179 L511 156 L472 151 L442 126 Z"/>
        <path class="land" d="M474 163 L515 157 L552 180 L566 221 L555 267 L534 309 L501 329 L475 296 L457 250 L449 204 Z"/>
        <path class="land" d="M785 306 L824 290 L867 303 L889 330 L878 360 L841 373 L805 357 L784 332 Z"/>
        <path class="land" d="M302 36 L335 24 L368 37 L372 58 L349 73 L315 66 Z"/>
        <path class="ice" d="M75 440 L165 427 L250 433 L342 423 L432 438 L521 427 L611 435 L701 425 L790 435 L905 427 L960 449 L916 469 L803 462 L702 471 L590 462 L481 472 L358 462 L239 471 L126 459 Z"/>
      </g>
      <g id="routes"></g><g id="markers"></g>
    </g>
  </svg>

  <div class="hud top-left"><div class="sigil">AI Freedom Trust Federation</div><div class="title">World Game</div></div>
  <div class="hud top-center"><div class="world-progress"><div class="level-orb"><div><strong id="level">–</strong><small>WORLD</small></div></div><div class="xp"><strong id="coverage">Reading geography…</strong><span id="xpText"></span><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div></div></div></div>
  <div class="hud top-right"><button class="icon" id="console" title="MoBox console">⌂</button><button class="icon" id="treeGame" title="Tree game">♧</button><button class="icon" id="fullscreen" title="Fullscreen">⛶</button></div>
  <div class="hud gps"><button class="gps-button" id="locate">◎ Use my location</button><select class="precision" id="precision" aria-label="GPS precision"><option value="city">City</option><option value="region">Region</option><option value="country">Country</option><option value="exact">Exact</option></select><button class="forget" id="forget" title="Forget GPS">×</button></div>
  <button class="hud quest-button" id="questButton"><span class="quest-rune">⌖</span><span><strong id="questTitle">Loading mapping quests…</strong><span id="questMeta">Privacy-neutral progression</span></span></button>
  <div class="status" id="status">GPS has not been requested · browser memory only</div>

  <section class="sheet" id="sheet" aria-live="polite"><div class="sheet-grip"></div><button class="sheet-close" id="sheetClose" aria-label="Close">×</button><h2 id="sheetTitle"></h2><div class="role" id="sheetRole"></div><div class="stats" id="sheetStats"></div><div class="repo-list" id="repoList"></div><div class="sheet-actions"><a id="consoleLink" href="/">Open MoBox</a><button id="focusButton">Focus location</button></div></section>
  <div class="toast" id="toast"></div>

  <script>
    const SVG="http://www.w3.org/2000/svg";const scene=document.getElementById("scene"),camera=document.getElementById("camera"),gridRoot=document.getElementById("grid"),routesRoot=document.getElementById("routes"),markersRoot=document.getElementById("markers");
    const state={world:null,deviceRaw:null,device:null,precision:"city",selected:null,questIndex:0,scale:1,tx:0,ty:0,pointers:new Map(),dragStart:null,pinch:null,statusLock:false,gpsRequestToken:0};
    function el(tag,attrs={}){const n=document.createElementNS(SVG,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));return n}
    function toast(message){const n=document.getElementById("toast");n.textContent=message;n.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove("show"),1800)}
    function decimals(){return state.precision==="country"?0:state.precision==="region"?1:state.precision==="exact"?5:2}function round(v){const f=10**decimals();return Math.round(v*f)/f}function project(lat,lon){return{x:(lon+180)/360*1000,y:(90-lat)/180*500}}
    async function load(){const r=await fetch("/v1/federation/world",{cache:"no-store"});if(!r.ok)throw new Error(`World API ${r.status}`);state.world=await r.json();renderHUD();renderGrid();render();renderQuest()}
    function renderHUD(){const p=state.world.progress;document.getElementById("level").textContent=p.level;document.getElementById("coverage").textContent=`${p.mapped} visible · ${p.hidden} private · ${p.unmapped} unmapped`;document.getElementById("xpText").textContent=`${p.xp.toLocaleString()} mapping XP · ${p.completed_quests}/${p.repositories} anchored`;document.getElementById("xpFill").style.width=`${Math.min(100,(p.xp%1000)/1000*100)}%`}
    function renderGrid(){gridRoot.replaceChildren();for(let lon=-150;lon<=150;lon+=30){const x=project(0,lon).x;gridRoot.append(el("line",{x1:x,y1:0,x2:x,y2:500,class:"grid"}))}for(let lat=-60;lat<=60;lat+=30){const y=project(lat,0).y;gridRoot.append(el("line",{x1:0,y1:y,x2:1000,y2:y,class:lat===0?"equator":"grid"}))}}
    function temporary(){return(state.world?.unmapped||[]).filter(x=>x.state==="missing")}
    function clusters(){const groups=new Map();for(const node of state.world?.nodes||[]){const key=`${node.latitude}:${node.longitude}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(node)}return[...groups.values()]}
    function clusterStatus(nodes){if(nodes.some(n=>n.status==="blocked"))return"blocked";if(nodes.every(n=>n.status==="ready"))return"ready";return"detected"}
    function render(){routesRoot.replaceChildren();markersRoot.replaceChildren();const cs=clusters();if(state.device){const a=project(state.device.latitude,state.device.longitude);for(const cluster of cs){const b=project(cluster[0].latitude,cluster[0].longitude);if(Math.abs(a.x-b.x)<1&&Math.abs(a.y-b.y)<1)continue;const curve=Math.min(a.y,b.y)-45;routesRoot.append(el("path",{d:`M${a.x},${a.y} Q${(a.x+b.x)/2},${curve} ${b.x},${b.y}`,class:"route"}))}}for(const c of cs)markersRoot.append(clusterMarker(c));if(state.device)markersRoot.append(deviceMarker());applyCamera()}
    function clusterMarker(nodes){const p=project(nodes[0].latitude,nodes[0].longitude),status=clusterStatus(nodes),g=el("g",{transform:`translate(${p.x} ${p.y})`,class:`marker ${status}${state.selected?.kind==="cluster"&&state.selected.nodes===nodes?" selected":""}`,tabindex:"0",role:"button","aria-label":`${nodes.length} repositories at ${nodes[0].label}`});g.append(el("circle",{r:nodes.length>1?11:8,fill:status==="ready"?"#1b4d2a":status==="blocked"?"#572329":"#513d14",stroke:"currentColor","stroke-width":2.2}));const t=el("text",{y:3});t.textContent=nodes.length>1?nodes.length:"●";g.append(t);const label=el("text",{y:21});label.textContent=nodes[0].label.length>22?nodes[0].label.slice(0,21)+"…":nodes[0].label;g.append(label);const select=()=>selectCluster(nodes);g.addEventListener("click",select);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select()}});return g}
    function deviceMarker(){const p=project(state.device.latitude,state.device.longitude),count=temporary().length,g=el("g",{transform:`translate(${p.x} ${p.y})`,class:`marker device${state.selected?.kind==="device"?" selected":""}`,tabindex:"0",role:"button","aria-label":`This phone and ${count} temporary repositories`});g.append(el("circle",{r:19,class:"device-ring"}));g.append(el("circle",{r:10,fill:"#0a4542",stroke:"#55eadb","stroke-width":2.6}));const t=el("text",{y:3});t.textContent=count||"◎";g.append(t);const label=el("text",{y:23});label.textContent=count?`YOU + ${count}`:"YOUR DEVICE";g.append(label);const select=()=>selectDevice();g.addEventListener("click",select);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select()}});return g}
    function fillStats(values){const root=document.getElementById("sheetStats");root.replaceChildren();for(const[k,v]of values){const s=document.createElement("div");s.className="stat";const a=document.createElement("small"),b=document.createElement("strong");a.textContent=k;b.textContent=v;s.append(a,b);root.append(s)}}
    function openSheet(){document.getElementById("sheet").classList.add("open")}function closeSheet(){document.getElementById("sheet").classList.remove("open");state.selected=null;render()}
    function selectCluster(nodes){state.selected={kind:"cluster",nodes};const n=nodes[0];document.getElementById("sheetTitle").textContent=nodes.length>1?`${nodes.length} Federation Repositories`:n.repository;document.getElementById("sheetRole").textContent=`${n.label} · ${n.precision} · ${n.visibility}`;fillStats([["Latitude",n.latitude],["Longitude",n.longitude],["Status",clusterStatus(nodes)],["Evidence",n.evidence]]);const list=document.getElementById("repoList");list.replaceChildren();for(const x of nodes){const row=document.createElement("div");row.className="repo";row.textContent=`${x.repository} · ${x.role} · ${x.status}`;list.append(row)}document.getElementById("consoleLink").href=`/?inspect=${encodeURIComponent(n.repository)}`;openSheet();render()}
    function selectDevice(){if(!state.device)return;state.selected={kind:"device"};document.getElementById("sheetTitle").textContent="Current Mobile Federation Host";document.getElementById("sheetRole").textContent="GPS · browser memory only · temporary anchor";fillStats([["Latitude",state.device.latitude],["Longitude",state.device.longitude],["Precision",state.precision],["Accuracy",`${Math.round(state.device.accuracy||0)} m`]]);const list=document.getElementById("repoList");list.replaceChildren();for(const x of temporary()){const row=document.createElement("div");row.className="repo";row.textContent=`${x.repository} · temporarily hosted here`;list.append(row)}document.getElementById("consoleLink").href="/";openSheet();render()}
    function selectUnmapped(item){state.selected={kind:"unmapped",item};document.getElementById("sheetTitle").textContent=item.repository;document.getElementById("sheetRole").textContent="Unmapped repository quest";fillStats([["State",item.state],["Status",item.status],["Role",item.role],["Reason",item.reason]]);document.getElementById("repoList").replaceChildren();document.getElementById("consoleLink").href=`/?inspect=${encodeURIComponent(item.repository)}`;openSheet()}
    function renderQuest(){const quests=state.world?.quests||[];const open=quests.filter(q=>q.status!=="complete"),pool=open.length?open:quests;if(!pool.length){document.getElementById("questTitle").textContent="The federation is geographically anchored";document.getElementById("questMeta").textContent="No mapping quests remain";return}state.questIndex%=pool.length;const q=pool[state.questIndex];document.getElementById("questTitle").textContent=q.title;document.getElementById("questMeta").textContent=`${q.repository} · ${q.status==="complete"?"evidence observed":`reward ${q.reward_xp} XP`}`}
    function requestGPS(){if(!navigator.geolocation){toast("Geolocation is unavailable");return}const requestToken=++state.gpsRequestToken;state.precision=document.getElementById("precision").value;setStatus("Waiting for GPS permission…",true);navigator.geolocation.getCurrentPosition(pos=>{if(requestToken!==state.gpsRequestToken)return;state.deviceRaw={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};applyPrecision();document.getElementById("locate").classList.add("active");document.getElementById("locate").textContent="◎ GPS active";setStatus(`${state.precision} precision · memory only`,true);render();selectDevice()},err=>{if(requestToken!==state.gpsRequestToken)return;const names={1:"permission denied",2:"position unavailable",3:"request timed out"};setStatus(`GPS ${names[err.code]||"failed"}`,true);toast(`GPS ${names[err.code]||err.message}`)},{enableHighAccuracy:state.precision==="exact",timeout:15000,maximumAge:60000})}
    function applyPrecision(){if(!state.deviceRaw)return;state.device={latitude:round(state.deviceRaw.latitude),longitude:round(state.deviceRaw.longitude),accuracy:state.deviceRaw.accuracy}}
    function forgetGPS(){state.gpsRequestToken++;state.deviceRaw=null;state.device=null;document.getElementById("locate").classList.remove("active");document.getElementById("locate").textContent="◎ Use my location";setStatus("GPS forgotten · no device coordinates remain",true);closeSheet();render();toast("GPS forgotten")}
    function setStatus(text,lock=false){document.getElementById("status").textContent=text;state.statusLock=lock}
    function focusSelected(){let p=null;if(state.selected?.kind==="device"&&state.device)p=project(state.device.latitude,state.device.longitude);if(state.selected?.kind==="cluster")p=project(state.selected.nodes[0].latitude,state.selected.nodes[0].longitude);if(!p)return;state.scale=2.25;state.tx=500-p.x*state.scale;state.ty=250-p.y*state.scale;applyCamera();document.getElementById("sheet").classList.remove("open")}
    function applyCamera(){camera.setAttribute("transform",`translate(${state.tx} ${state.ty}) scale(${state.scale})`)}
    function zoomAt(factor,cx,cy){const next=Math.max(.7,Math.min(5,state.scale*factor)),rect=scene.getBoundingClientRect(),x=(cx-rect.left)/rect.width*1000,y=(cy-rect.top)/rect.height*500;state.tx=x-(x-state.tx)/state.scale*next;state.ty=y-(y-state.ty)/state.scale*next;state.scale=next;applyCamera()}
    scene.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});scene.addEventListener("pointerdown",e=>{scene.setPointerCapture(e.pointerId);state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});scene.classList.add("dragging");if(state.pointers.size===1)state.dragStart={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};if(state.pointers.size===2){const p=[...state.pointers.values()];state.pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),scale:state.scale}}});scene.addEventListener("pointermove",e=>{if(!state.pointers.has(e.pointerId))return;state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.pointers.size===1&&state.dragStart){const rect=scene.getBoundingClientRect();state.tx=state.dragStart.tx+(e.clientX-state.dragStart.x)/rect.width*1000;state.ty=state.dragStart.ty+(e.clientY-state.dragStart.y)/rect.height*500;applyCamera()}else if(state.pointers.size===2&&state.pinch){const p=[...state.pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);state.scale=Math.max(.7,Math.min(5,state.pinch.scale*d/state.pinch.distance));applyCamera()}});function release(e){state.pointers.delete(e.pointerId);if(!state.pointers.size){scene.classList.remove("dragging");state.dragStart=null;state.pinch=null}else if(state.pointers.size===1){const p=[...state.pointers.values()][0];state.dragStart={x:p.x,y:p.y,tx:state.tx,ty:state.ty};state.pinch=null}}scene.addEventListener("pointerup",release);scene.addEventListener("pointercancel",release);
    document.getElementById("locate").addEventListener("click",requestGPS);document.getElementById("forget").addEventListener("click",forgetGPS);document.getElementById("precision").addEventListener("change",e=>{state.precision=e.target.value;applyPrecision();if(state.device){setStatus(`${state.precision} precision · memory only`,true);render();selectDevice()}});document.getElementById("questButton").addEventListener("click",()=>{const open=(state.world?.quests||[]).filter(q=>q.status!=="complete"),pool=open.length?open:state.world.quests;if(!pool.length)return;state.questIndex=(state.questIndex+1)%pool.length;renderQuest();const q=pool[state.questIndex],node=(state.world.nodes||[]).find(n=>n.repository_id===q.repository_id),item=(state.world.unmapped||[]).find(n=>n.repository_id===q.repository_id);if(node)selectCluster([node]);else if(item)selectUnmapped(item)});document.getElementById("console").addEventListener("click",()=>location.assign("/"));document.getElementById("treeGame").addEventListener("click",()=>location.assign("/tree"));document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast("Fullscreen is unavailable in this browser")}});document.getElementById("sheetClose").addEventListener("click",closeSheet);document.getElementById("focusButton").addEventListener("click",focusSelected);
    load().catch(error=>{document.getElementById("coverage").textContent="World unavailable";document.getElementById("xpText").textContent=error.message;toast(error.message)});
  </script>
