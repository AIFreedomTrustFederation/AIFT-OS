<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030711">
  <title>Federation Tree of Life</title>
  <style>
    :root{color-scheme:dark;--gold:#f2cb73;--cyan:#55eadb;--violet:#b893ff;--good:#a7ef7b;--warn:#f2be58;--bad:#ff8c8c;--muted:#94a4bb}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eef5ff;font-family:Inter,system-ui,sans-serif}
    body:before,body:after{content:"";position:fixed;inset:-20%;pointer-events:none}
    body:before{background:radial-gradient(circle at 50% 92%,rgba(19,218,157,.14),transparent 34%),radial-gradient(circle at 50% 8%,rgba(134,80,255,.16),transparent 38%),linear-gradient(180deg,#070719,#020811 60%,#020c0b);animation:breathe 9s ease-in-out infinite alternate}
    body:after{opacity:.24;background-image:radial-gradient(circle,rgba(255,255,255,.65) 0 1px,transparent 1.4px);background-size:43px 43px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
    @keyframes breathe{to{transform:scale(1.04);filter:saturate(1.2)}}
    #scene{position:fixed;inset:0;width:100%;height:100%;z-index:1;cursor:grab}
    #scene.dragging{cursor:grabbing}
    .edge{fill:none;stroke-width:2;opacity:.42}.edge.life{stroke:#42dccd}.edge.knowledge{stroke:#ad82ff}.edge.root,.edge.living-layer{stroke:#dcb55a}.edge.dim{opacity:.07}
    .node{cursor:pointer;outline:none}.node circle{transform-box:fill-box;transform-origin:center;transition:transform .16s ease,filter .16s ease,opacity .16s ease}.node:hover circle,.node:focus circle,.node.selected circle{transform:scale(1.14);filter:drop-shadow(0 0 12px currentColor)}
    .node.ready{color:var(--good)}.node.detected{color:var(--warn)}.node.blocked{color:var(--bad)}.node.layer{color:#92a4bd}.node.federation{color:var(--gold)}.node.dim{opacity:.13;pointer-events:none}
    .node.ready .pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{50%{r:35;opacity:.06}}
    .node text{fill:#f4f7ff;text-anchor:middle;paint-order:stroke;stroke:#030711;stroke-width:5px;stroke-linejoin:round;pointer-events:none;font-weight:800;font-size:12px}.node .meta{fill:#91a1ba;font-size:9px;font-weight:600}.node.layer text{font-size:10px}.node.federation text{font-size:13px}
    .layer-glow{opacity:.055}.layer-word{fill:#71839d;font-size:8px;letter-spacing:.18em;text-anchor:start}
    .hud{position:fixed;z-index:10;pointer-events:none}.hud>*{pointer-events:auto}
    .top-left{left:max(16px,env(safe-area-inset-left));top:max(15px,env(safe-area-inset-top))}.top-center{left:50%;top:max(13px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center}.top-right{right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:7px}
    .sigil{font-size:10px;letter-spacing:.25em;color:#9bb0c8;text-transform:uppercase}.title{margin-top:2px;font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:-.04em;color:#f4dfaa;text-shadow:0 0 30px rgba(242,203,115,.25)}
    .hud-progress{display:flex;align-items:center;gap:10px;justify-content:center}.level-orb{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#2d2718,rgba(10,12,20,.35) 65%,transparent);box-shadow:0 0 24px rgba(242,203,115,.18)}.level-orb strong{color:var(--gold);font-size:17px}.level-orb small{display:block;font-size:6px;color:#9e9273;letter-spacing:.15em}
    .xp{min-width:120px}.xp strong{display:block;font-size:11px;color:#f6e6ba}.xp span{display:block;font-size:8px;color:var(--muted)}.xp-track{height:3px;margin-top:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan)}
    .icon{width:43px;height:43px;border:0;border-radius:50%;background:rgba(8,13,23,.48);backdrop-filter:blur(12px);color:#dce8f9;font-size:18px;display:grid;place-items:center;box-shadow:0 10px 25px rgba(0,0,0,.22)}.icon:active{transform:scale(.94)}
    .filterbar{left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:5px;max-width:calc(100vw - 24px);overflow:auto;padding:5px}.filter{border:0;border-radius:999px;padding:8px 11px;background:rgba(8,13,23,.48);backdrop-filter:blur(12px);color:#90a0b7;font-size:9px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.filter.active{color:#fff0bd;background:rgba(69,55,20,.6);box-shadow:0 0 18px rgba(242,203,115,.12)}
    .quest-button{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:9px 13px 9px 10px;background:rgba(9,15,25,.56);backdrop-filter:blur(14px);color:#eaf2ff;max-width:56vw;text-align:left;box-shadow:0 15px 35px rgba(0,0,0,.25)}.quest-rune{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#4d3b13,#14120b);color:var(--gold);flex:0 0 auto}.quest-button strong{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quest-button span{display:block;font-size:8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sheet{position:fixed;z-index:20;left:50%;bottom:0;width:min(620px,100%);transform:translate(-50%,105%);transition:transform .24s ease;padding:28px max(20px,env(safe-area-inset-left)) max(24px,calc(env(safe-area-inset-bottom) + 18px));background:linear-gradient(180deg,rgba(7,12,21,.04),rgba(7,12,21,.94) 22%);backdrop-filter:blur(18px);pointer-events:none}.sheet.open{transform:translate(-50%,0);pointer-events:auto}.sheet-grip{width:44px;height:3px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 16px}.sheet-close{position:absolute;right:17px;top:20px;border:0;background:transparent;color:#91a1b7;font-size:23px}.sheet h2{margin:0;color:#f7e4af;font-size:26px;line-height:1}.sheet .role{margin-top:6px;color:var(--cyan);font-size:9px;letter-spacing:.15em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat small{display:block;color:#788aa5;font-size:8px;text-transform:uppercase}.stat strong{display:block;margin-top:2px;color:#edf4ff;font-size:14px}.caps{display:flex;gap:5px;overflow:auto;padding-bottom:4px}.cap{white-space:nowrap;font-size:8px;color:#a8b7ca;background:rgba(255,255,255,.06);border-radius:999px;padding:5px 8px}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions a,.sheet-actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:10px;background:rgba(85,234,219,.12);color:#bff5ec;font-weight:800;font-size:10px}
    .toast{position:fixed;z-index:30;left:50%;top:18%;transform:translate(-50%,-10px);opacity:0;transition:.2s;padding:9px 14px;border-radius:999px;background:rgba(7,12,20,.72);backdrop-filter:blur(12px);color:#dce8f8;font-size:10px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:650px){.top-center{top:max(75px,calc(env(safe-area-inset-top) + 62px))}.top-left .title{font-size:18px}.top-left .sigil{font-size:8px}.top-right{gap:4px}.icon{width:39px;height:39px}.filterbar{bottom:max(73px,calc(env(safe-area-inset-bottom) + 58px));max-width:100vw}.quest-button{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:none}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <svg id="scene" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" aria-label="Interactive Federation Tree of Life">
    <defs>
      <radialGradient id="rootGlow"><stop offset="0" stop-color="#f2cb73" stop-opacity=".46"/><stop offset="1" stop-color="#f2cb73" stop-opacity="0"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    </defs>
    <g id="camera"><g id="bands"></g><g id="edges"></g><g id="nodes"></g></g>
  </svg>

  <div class="hud top-left"><div class="sigil">AI Freedom Trust Federation</div><div class="title">Tree of Life</div></div>
  <div class="hud top-center"><div class="hud-progress"><div class="level-orb"><div><strong id="level">–</strong><small>LEVEL</small></div></div><div class="xp"><strong id="coherence">Reading evidence…</strong><span id="xpText"></span><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div></div></div></div>
  <div class="hud top-right"><button class="icon" id="console" title="MoBox console">⌂</button><button class="icon" id="worldGame" title="World game">◎</button><button class="icon" id="fullscreen" title="Fullscreen">⛶</button></div>
  <div class="hud filterbar" id="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="life">Life</button><button class="filter" data-filter="knowledge">Knowledge</button><button class="filter" data-filter="ready">Ready</button><button class="filter" data-filter="blocked">Blocked</button></div>
  <button class="hud quest-button" id="questButton"><span class="quest-rune">✦</span><span><strong id="questTitle">Loading quests…</strong><span id="questMeta">Evidence-derived progression</span></span></button>

  <section class="sheet" id="sheet" aria-live="polite"><div class="sheet-grip"></div><button class="sheet-close" id="sheetClose" aria-label="Close">×</button><h2 id="sheetTitle"></h2><div class="role" id="sheetRole"></div><div class="stats" id="sheetStats"></div><div class="caps" id="sheetCaps"></div><div class="sheet-actions"><a id="inspectLink" href="/">Inspect in MoBox</a><button id="focusButton">Focus node</button></div></section>
  <div class="toast" id="toast"></div>

  <script>
    const SVG="http://www.w3.org/2000/svg";
    const scene=document.getElementById("scene"),camera=document.getElementById("camera"),edgesRoot=document.getElementById("edges"),nodesRoot=document.getElementById("nodes"),bandsRoot=document.getElementById("bands");
    const state={tree:null,filter:"all",selected:null,questIndex:0,scale:1,tx:0,ty:0,pointers:new Map(),dragStart:null,pinch:null};
    const layerColors=["#ff351f","#ff8a1c","#ffd633","#22d36a","#26d6f0","#5270ff","#a45cff"];
    function el(tag,attrs={}){const n=document.createElementNS(SVG,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));return n}
    function toast(message){const n=document.getElementById("toast");n.textContent=message;n.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove("show"),1800)}
    async function load(){const response=await fetch("/v1/federation/tree",{cache:"no-store"});if(!response.ok)throw new Error(`Tree API ${response.status}`);state.tree=await response.json();renderHUD();render();renderQuest();}
    function renderHUD(){const p=state.tree.progress;document.getElementById("level").textContent=p.level;document.getElementById("coherence").textContent=`${p.coherence}% federation coherence`;document.getElementById("xpText").textContent=`${p.xp.toLocaleString()} evidence XP · ${p.ready}/${p.repositories} ready`;document.getElementById("xpFill").style.width=`${Math.min(100,p.current_level_xp/p.next_level_xp*100)}%`}
    function positions(){const pos={"federation-root":{x:500,y:1300}};for(const layer of state.tree.layers)pos[`layer-${layer.number}`]={x:500,y:1190-(layer.number-1)*150};const repos=state.tree.nodes.filter(n=>n.kind==="repository");for(const layer of state.tree.layers){for(const branch of["life","knowledge","root"]){const group=repos.filter(n=>n.layer===layer.number&&n.branch===branch);group.forEach((node,index)=>{const spread=(index-(group.length-1)/2)*92;const y=1190-(layer.number-1)*150+spread;if(branch==="life")pos[node.id]={x:300-(index%3)*115,y};else if(branch==="knowledge")pos[node.id]={x:700+(index%3)*115,y};else pos[node.id]={x:500,y:y-70}})}}return pos}
    function visible(node){if(node.kind!=="repository")return true;if(state.filter==="all")return true;if(state.filter==="life"||state.filter==="knowledge")return node.branch===state.filter;return node.status===state.filter}
    function render(){bandsRoot.replaceChildren();edgesRoot.replaceChildren();nodesRoot.replaceChildren();const pos=positions();for(const layer of state.tree.layers){const y=1190-(layer.number-1)*150;bandsRoot.append(el("ellipse",{cx:500,cy:y,rx:465,ry:68,fill:layer.color||layerColors[layer.number-1],class:"layer-glow"}));const label=el("text",{x:28,y:y+4,class:"layer-word"});label.textContent=`${layer.roman}  ${layer.name.toUpperCase()}`;bandsRoot.append(label)}const glow=el("circle",{cx:500,cy:1300,r:180,fill:"url(#rootGlow)",filter:"url(#soft)"});bandsRoot.append(glow);
      for(const edge of state.tree.edges){const a=pos[edge.source],b=pos[edge.target],sa=state.tree.nodes.find(n=>n.id===edge.source),sb=state.tree.nodes.find(n=>n.id===edge.target);if(!a||!b||!sa||!sb)continue;const dim=!visible(sa)||!visible(sb);const bend=(a.x+b.x)/2;edgesRoot.append(el("path",{d:`M${a.x},${a.y} C${bend},${a.y} ${bend},${b.y} ${b.x},${b.y}`,class:`edge ${edge.kind}${dim?" dim":""}`}))}
      for(const node of state.tree.nodes){const p=pos[node.id];if(!p)continue;nodesRoot.append(nodeElement(node,p,!visible(node)))}applyCamera()}
    function nodeElement(node,p,dim){const status=node.kind==="repository"?(node.status||"detected"):node.kind;const g=el("g",{transform:`translate(${p.x} ${p.y})`,class:`node ${status}${dim?" dim":""}${state.selected&&state.selected.id===node.id?" selected":""}`,tabindex:"0",role:"button","aria-label":`${node.name}, ${node.status}`});const radius=node.kind==="federation"?42:node.kind==="layer"?20:28;const layer=state.tree.layers.find(x=>x.number===node.layer);const fill=node.kind==="layer"?(layer?.color||"#71829b"):node.branch==="knowledge"?"#281743":node.branch==="life"?"#083a37":"#473512";const stroke=node.kind==="repository"?(node.status==="ready"?"#a7ef7b":node.status==="blocked"?"#ff8c8c":"#f2be58"):(layer?.color||"#f2cb73");if(node.kind==="repository")g.append(el("circle",{r:28,fill:"none",stroke,"stroke-width":1,opacity:.18,class:"pulse"}));g.append(el("circle",{r:radius,fill,stroke,"stroke-width":node.kind==="repository"?3:2.2}));const title=el("text",{y:radius+18});title.textContent=node.kind==="layer"?(layer?.roman||node.layer):node.name;g.append(title);if(node.kind==="repository"){const meta=el("text",{y:radius+32,class:"meta"});meta.textContent=`LV ${node.level} · ${node.growth}%`;g.append(meta)}const select=()=>selectNode(node);g.addEventListener("click",select);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select()}});return g}
    function selectNode(node){state.selected=node;render();const sheet=document.getElementById("sheet");document.getElementById("sheetTitle").textContent=node.name;document.getElementById("sheetRole").textContent=node.kind==="repository"?`${node.layer_name} · ${node.branch} · ${node.role}`:`${node.kind} · ${node.layer_name||"One Root"}`;const stats=document.getElementById("sheetStats");stats.replaceChildren();const values=node.kind==="repository"?[["Status",node.status],["Level",node.level],["Growth",`${node.growth}%`],["Evidence XP",node.xp]]:[["Status",node.status],["Level",node.level],["Growth",`${node.growth}%`],["Kind",node.kind]];for(const [k,v]of values){const s=document.createElement("div");s.className="stat";const a=document.createElement("small"),b=document.createElement("strong");a.textContent=k;b.textContent=v;s.append(a,b);stats.append(s)}const caps=document.getElementById("sheetCaps");caps.replaceChildren();for(const cap of node.capabilities||[]){const c=document.createElement("span");c.className="cap";c.textContent=`${cap.name} · ${cap.status}`;caps.append(c)}document.getElementById("inspectLink").href=node.kind==="repository"?`/?inspect=${encodeURIComponent(node.name)}`:"/";sheet.classList.add("open")}
    function closeSheet(){document.getElementById("sheet").classList.remove("open");state.selected=null;render()}
    function renderQuest(){const quests=state.tree?.quests||[];const open=quests.filter(q=>q.status!=="complete"),pool=open.length?open:quests;if(!pool.length){document.getElementById("questTitle").textContent="Federation fully awakened";document.getElementById("questMeta").textContent="No evidence quests remain";return}state.questIndex%=pool.length;const q=pool[state.questIndex];document.getElementById("questTitle").textContent=q.title;document.getElementById("questMeta").textContent=`${q.repository} · ${q.status==="complete"?"evidence observed":`reward ${q.reward_xp} XP`}`}
    function focusSelected(){if(!state.selected)return;const p=positions()[state.selected.id];if(!p)return;state.scale=1.55;state.tx=500-p.x*state.scale;state.ty=700-p.y*state.scale;applyCamera();closeSheet();toast(`Focused ${state.selected?.name||"node"}`)}
    function applyCamera(){camera.setAttribute("transform",`translate(${state.tx} ${state.ty}) scale(${state.scale})`)}
    function zoomAt(factor,cx,cy){const next=Math.max(.55,Math.min(3.2,state.scale*factor));const rect=scene.getBoundingClientRect();const x=(cx-rect.left)/rect.width*1000,y=(cy-rect.top)/rect.height*1400;state.tx=x-(x-state.tx)/state.scale*next;state.ty=y-(y-state.ty)/state.scale*next;state.scale=next;applyCamera()}
    scene.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});
    scene.addEventListener("pointerdown",e=>{scene.setPointerCapture(e.pointerId);state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});scene.classList.add("dragging");if(state.pointers.size===1)state.dragStart={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};if(state.pointers.size===2){const p=[...state.pointers.values()];state.pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),scale:state.scale}}});
    scene.addEventListener("pointermove",e=>{if(!state.pointers.has(e.pointerId))return;state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.pointers.size===1&&state.dragStart){const rect=scene.getBoundingClientRect();state.tx=state.dragStart.tx+(e.clientX-state.dragStart.x)/rect.width*1000;state.ty=state.dragStart.ty+(e.clientY-state.dragStart.y)/rect.height*1400;applyCamera()}else if(state.pointers.size===2&&state.pinch){const p=[...state.pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);state.scale=Math.max(.55,Math.min(3.2,state.pinch.scale*distance/state.pinch.distance));applyCamera()}});
    function release(e){state.pointers.delete(e.pointerId);if(!state.pointers.size){scene.classList.remove("dragging");state.dragStart=null;state.pinch=null}else if(state.pointers.size===1){const p=[...state.pointers.values()][0];state.dragStart={x:p.x,y:p.y,tx:state.tx,ty:state.ty};state.pinch=null}}scene.addEventListener("pointerup",release);scene.addEventListener("pointercancel",release);
    document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
    document.getElementById("questButton").addEventListener("click",()=>{const quests=(state.tree?.quests||[]).filter(q=>q.status!=="complete");const pool=quests.length?quests:state.tree.quests;if(!pool.length)return;state.questIndex=(state.questIndex+1)%pool.length;renderQuest();const q=pool[state.questIndex],node=state.tree.nodes.find(n=>n.kind==="repository"&&n.name===q.repository);if(node)selectNode(node)});
    document.getElementById("console").addEventListener("click",()=>location.assign("/"));document.getElementById("worldGame").addEventListener("click",()=>location.assign("/world"));document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast("Fullscreen is unavailable in this browser")}});document.getElementById("sheetClose").addEventListener("click",closeSheet);document.getElementById("focusButton").addEventListener("click",focusSelected);
    load().catch(error=>{document.getElementById("coherence").textContent="Tree unavailable";document.getElementById("xpText").textContent=error.message;toast(error.message)});
  </script>
</body>
</html>
