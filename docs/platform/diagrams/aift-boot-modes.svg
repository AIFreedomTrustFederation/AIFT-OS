<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870" role="img" aria-labelledby="title desc">
<title id="title">AIFT boot compatibility and device frontier infographic</title><desc id="desc">Four proposed platform-specific boot routes: Windows PCs use UEFI and safe chainloading, Intel Macs use EFI and T2 model checks, Apple Silicon uses Apple policies with Asahi m1n1 and U-Boot where supported, and future ARM phones and robots require target-specific boot and safety. All progress leads through virtual tests, approval and independently validated hardware.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1027"/><stop offset=".5" stop-color="#122c49"/><stop offset="1" stop-color="#21173e"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f36c68"/><stop offset=".33" stop-color="#ffce74"/><stop offset=".68" stop-color="#44d9c0"/><stop offset="1" stop-color="#a184ff"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#eaf3ff}.sub{fill:#b8cee7;font-size:18px}.small{fill:#c2d8ee;font-size:16px}.top{font-size:28px;font-weight:750}.card{fill:#152744;stroke:#476384;stroke-width:2}.link{fill:none;stroke:#67bbdf;stroke-width:3;stroke-linejoin:round}</style></defs>
<rect width="1400" height="870" fill="url(#bg)"/><text x="700" y="60" text-anchor="middle" font-size="36" font-weight="750">AIFT UNIVERSAL BOOT &amp; DEVICE FRONTIER</text><text x="700" y="96" text-anchor="middle" class="sub">Shared operating-system experience, different hardware-specific boot chains</text><rect x="524" y="120" width="352" height="34" rx="17" fill="#3b3343" stroke="#f4c172"/><text x="700" y="144" text-anchor="middle" font-size="16">RESEARCH / PROPOSED, NOT INSTALLED</text>
<rect x="78" y="197" width="286" height="295" rx="20" class="card"/><rect x="397" y="197" width="286" height="295" rx="20" class="card"/><rect x="716" y="197" width="286" height="295" rx="20" class="card"/><rect x="1035" y="197" width="286" height="295" rx="20" class="card"/>
<rect x="86" y="206" width="270" height="8" rx="4" fill="#f36c68"/><rect x="405" y="206" width="270" height="8" rx="4" fill="#ffce74"/><rect x="724" y="206" width="270" height="8" rx="4" fill="#44d9c0"/><rect x="1043" y="206" width="270" height="8" rx="4" fill="#a184ff"/>
<text x="221" y="258" text-anchor="middle" class="top">WINDOWS PCs</text><text x="221" y="290" text-anchor="middle" class="sub">x86-64 UEFI</text><text x="221" y="329" text-anchor="middle" class="small">OVMF / EFI selector</text><text x="221" y="360" text-anchor="middle" class="small">AIFT Linux + Windows</text><text x="221" y="391" text-anchor="middle" class="small">Boot Manager coexistence</text><text x="221" y="439" text-anchor="middle" class="small">Secure Boot &amp; BitLocker</text><text x="221" y="463" text-anchor="middle" class="small">recovery first</text>
<text x="540" y="258" text-anchor="middle" class="top">INTEL Macs</text><text x="540" y="290" text-anchor="middle" class="sub">EFI / T2 profiles</text><text x="540" y="329" text-anchor="middle" class="small">Model-specific startup</text><text x="540" y="360" text-anchor="middle" class="small">Hardware + driver checks</text><text x="540" y="391" text-anchor="middle" class="small">Reversible install plan</text><text x="540" y="439" text-anchor="middle" class="small">No general firmware</text><text x="540" y="463" text-anchor="middle" class="small">replacement claim</text>
<text x="859" y="258" text-anchor="middle" class="top">APPLE Silicon</text><text x="859" y="290" text-anchor="middle" class="sub">Apple boot policy</text><text x="859" y="329" text-anchor="middle" class="small">Asahi / m1n1 / U-Boot</text><text x="859" y="360" text-anchor="middle" class="small">Where model supported</text><text x="859" y="391" text-anchor="middle" class="small">No generic PC UEFI</text><text x="859" y="439" text-anchor="middle" class="small">Model and SoC</text><text x="859" y="463" text-anchor="middle" class="small">evidence required</text>
<text x="1178" y="258" text-anchor="middle" class="top">ARM / AI devices</text><text x="1178" y="290" text-anchor="middle" class="sub">Phones, robots, boards</text><text x="1178" y="329" text-anchor="middle" class="small">Vendor / target boot</text><text x="1178" y="360" text-anchor="middle" class="small">AOSP / RTOS / Linux</text><text x="1178" y="391" text-anchor="middle" class="small">Independent safety gate</text><text x="1178" y="439" text-anchor="middle" class="small">Emulator &amp; simulation</text><text x="1178" y="463" text-anchor="middle" class="small">before physical testing</text>
<path d="M221 492 V528 H1178 V492 M540 492 V528 M859 492 V528 M699 528 V559" class="link"/>
<rect x="186" y="566" width="1028" height="108" rx="20" class="card"/><text x="700" y="606" text-anchor="middle" class="top">EVIDENCE &amp; SAFETY GRADUATION</text><text x="700" y="643" text-anchor="middle" class="sub">Virtual build + negative tests → exact artifact hashes → recovery → human approval</text>
<path d="M700 674 V708" class="link"/><rect x="245" y="717" width="910" height="94" rx="18" fill="#10324d" stroke="#48d9c2" stroke-width="2"/>
<text x="700" y="760" text-anchor="middle" class="top">APPROVED MODEL-SPECIFIC HARDWARE ALPHA</text><text x="700" y="790" text-anchor="middle" class="small">Only after explicit owner authorization and documented rollback</text>
<text x="700" y="850" text-anchor="middle" class="small">Boot manager ≠ BIOS replacement · Browser UI ≠ kernel · ROS 2 ≠ certified physical safety</text>
</svg>