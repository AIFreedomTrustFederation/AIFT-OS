<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
<title id="title">AIFT Universal Operating System proposed layers infographic</title>
<desc id="desc">A cinematic architecture infographic showing one AIFT operating experience above native, hosted and embodied operating modes; service contracts, safety boundaries, repository roots and verification evidence below. All architecture is proposed and not a claim of deployment.</desc>
<defs><linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090c1d"/><stop offset=".52" stop-color="#102043"/><stop offset="1" stop-color="#170f36"/></linearGradient><linearGradient id="spectral" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f15b5b"/><stop offset=".35" stop-color="#edb958"/><stop offset=".65" stop-color="#41deb6"/><stop offset=".85" stop-color="#60b7ff"/><stop offset="1" stop-color="#a67eff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><style>text{font-family:Inter,Arial,sans-serif;fill:#eaf2ff} .muted{fill:#b9c8e2}.small{font-size:18px}.mini{font-size:15px}.heading{font-size:28px;font-weight:700}.section{font-size:20px;font-weight:700} .card{fill:#182647;stroke:#4b648d;stroke-width:2} .line{fill:none;stroke:#80bfee;stroke-width:3;stroke-linecap:round}</style></defs>
<rect width="1400" height="930" fill="url(#space)"/><circle cx="1190" cy="130" r="180" fill="#4e509b" opacity=".12" filter="url(#glow)"/><circle cx="200" cy="730" r="230" fill="#2d88ab" opacity=".09" filter="url(#glow)"/>
<text x="700" y="74" text-anchor="middle" font-size="37" font-weight="750">AIFT UNIVERSAL OPERATING SYSTEM</text>
<text x="700" y="109" text-anchor="middle" class="muted small">One shared experience • Native hardware • Hosted sessions • Embodied frontier</text>
<rect x="520" y="129" width="360" height="33" rx="16" fill="#3e3040" stroke="#f4ba72"/><text x="700" y="151" text-anchor="middle" font-size="16" fill="#ffdb9f">DESIGN TARGET — NOT DEPLOYED</text>
<rect x="170" y="188" width="1060" height="124" rx="22" class="card"/><rect x="180" y="194" width="1040" height="7" rx="4" fill="url(#spectral)"/>
<text x="700" y="239" text-anchor="middle" class="heading">LIVING UNIVERSE / AIFT DESKTOP</text>
<text x="700" y="269" text-anchor="middle" class="muted small">Application launcher · Windows · Files · System status · Accessibility · Local-first AI</text>
