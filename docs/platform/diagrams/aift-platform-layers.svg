<rect x="84" y="362" width="389" height="208" rx="20" class="card"/><rect x="505" y="362" width="389" height="208" rx="20" class="card"/><rect x="926" y="362" width="389" height="208" rx="20" class="card"/>
<rect x="96" y="378" width="365" height="7" rx="4" fill="#edb958"/><rect x="517" y="378" width="365" height="7" rx="4" fill="#41deb6"/><rect x="938" y="378" width="365" height="7" rx="4" fill="#a67eff"/>
<text x="278" y="427" text-anchor="middle" class="heading">NATIVE OS</text><text x="278" y="458" text-anchor="middle" class="muted small">UEFI / Linux / AIFT services</text><text x="278" y="488" text-anchor="middle" class="muted small">Offline boot, local hardware</text><text x="278" y="532" text-anchor="middle" class="mini">Evidence: QEMU → approved hardware</text>
<text x="699" y="427" text-anchor="middle" class="heading">HOSTED OS</text><text x="699" y="458" text-anchor="middle" class="muted small">Isolated session / secure APIs</text><text x="699" y="488" text-anchor="middle" class="muted small">Browser client, persistent data</text><text x="699" y="532" text-anchor="middle" class="mini">Evidence: auth + isolation tests</text>
<text x="1120" y="427" text-anchor="middle" class="heading">EMBODIED / MOBILE</text><text x="1120" y="458" text-anchor="middle" class="muted small">Robot simulation / phone emulator</text><text x="1120" y="488" text-anchor="middle" class="muted small">Device-local safety and consent</text><text x="1120" y="532" text-anchor="middle" class="mini">Evidence: fault + revoke tests</text>
