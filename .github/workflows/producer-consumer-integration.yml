name: Producer consumer integration

on:
  pull_request:
    paths:
      - '.github/workflows/producer-consumer-integration.yml'
      - 'scripts/verify_producer_integration.py'
      - 'scripts/check_federation_evidence.py'
      - 'integration/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/producer-consumer-integration.yml'
      - 'scripts/verify_producer_integration.py'
      - 'scripts/check_federation_evidence.py'
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: control-plane
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: AIFreedomTrustFederation/AIFT-Runtime
          ref: a713fd7807da1e308889572aca34987c98c1b6bb
          path: producers/runtime
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: AIFreedomTrustFederation/AIFT-Forge
          ref: 584781172a48c2d8ed1aaff70ae543a70f7822d6
          path: producers/forge
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Provision locked Forge dependencies without lifecycle scripts
        working-directory: producers/forge
        run: npm ci --ignore-scripts
      - name: Exercise real exporters with disposable negative fixtures
        env:
          AIFT_TEST_RUNTIME_ROOT: ${{ github.workspace }}/producers/runtime
          AIFT_TEST_FORGE_ROOT: ${{ github.workspace }}/producers/forge
        run: python3 -B control-plane/integration/test_producer_consumer.py -v
      - name: Run real source QA and consume both local evidence records
        run: |
          python3 -B control-plane/scripts/verify_producer_integration.py \
            --runtime-root producers/runtime \
            --runtime-sha a713fd7807da1e308889572aca34987c98c1b6bb \
            --forge-root producers/forge \
            --forge-sha 584781172a48c2d8ed1aaff70ae543a70f7822d6
