name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Typecheck workspace
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          export PATH="$RUNNER_TEMP/corepack:$PATH"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck

      - name: Run canonical verification
        env:
          AIFT_KEEP_ARTIFACTS: "1"
        run: make verify

      - name: Verify no unexpected checkout changes
        run: |
          git status --porcelain | awk '
            $2 != "coverage.out" &&
            $2 != "reports/coverage.txt" &&
            $2 != "registry/architecture.json" &&
            $2 != "docs/ARCHITECTURE.md" &&
            $2 != "reports/architecture-report.md" { print; unexpected = 1 }
            END { exit unexpected }
          '

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.out
            reports/coverage.txt
          if-no-files-found: warn

      - name: Upload architecture artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: architecture-report
          path: |
            registry/architecture.json
            reports/architecture-report.md
          if-no-files-found: warn
