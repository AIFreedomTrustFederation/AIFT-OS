name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run canonical verification
        env:
          AIFT_KEEP_ARTIFACTS: "1"
        run: make verify

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.out
            reports/coverage.txt
          if-no-files-found: warn

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-report
          path: |
            registry/architecture.json
            reports/architecture-report.md
          if-no-files-found: warn
