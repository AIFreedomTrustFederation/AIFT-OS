name: AIFT Aetherion Local Worker Readiness

on:
  workflow_dispatch:
    inputs:
      run_local_smoke:
        description: 'Explicitly test a pre-approved isolated local model runner'
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - '.github/workflows/aift-aetherion-readiness.yml'
      - '.github/actionlint.yaml'
      - 'scripts/aift_aetherion_readiness.py'
      - 'tests/test_aift_aetherion_readiness.py'
      - 'docs/aetherion-worker-readiness.md'

permissions:
  contents: read

concurrency:
  group: aift-aetherion-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline smoke-test contract
        run: python3 -B -m unittest discover -s tests -p 'test_aift_aetherion_readiness.py' -v

  workflow-lint:
    # Read-only hosted lint; does not execute model or publisher jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
      - name: actionlint strict workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aift-bin"
          GOBIN="$RUNNER_TEMP/aift-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/aift-bin/actionlint" \
            .github/workflows/aift-aetherion-readiness.yml \
            .github/workflows/aift-secure-cloud-worker.yml
      - name: zizmor high-confidence workflow security audit
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          online-audits: false
          min-severity: high
          min-confidence: high
          inputs: |
            .github/workflows/aift-aetherion-readiness.yml
            .github/workflows/aift-secure-cloud-worker.yml

  operator-local-smoke:
    # NOT an automatic or public runner-registration mechanism.
    # Never execute model jobs on PR events or non-main workflow dispatches.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_local_smoke == true
    needs: offline-contract
    # Runner group must be provisioned and approved separately.
    runs-on:
      group: aift-isolated-ephemeral
      labels: [self-hosted, linux, aift-local-model]
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out the trusted exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded live Aetherion smoke test (no publisher secrets)
        shell: bash
        env:
          AIFT_MODEL_URL: ${{ vars.AIFT_MODEL_URL }}
          AIFT_MODEL_NAME: ${{ vars.AIFT_MODEL_NAME }}
        run: |
          set -euo pipefail
          test -n "$AIFT_MODEL_URL" || { echo "::error::AIFT_MODEL_URL is required"; exit 1; }
          test -n "$AIFT_MODEL_NAME" || { echo "::error::AIFT_MODEL_NAME is required"; exit 1; }
          python3 -B scripts/aift_aetherion_readiness.py \
            --repetitions 5 --varied-fixtures --expected-sha "$GITHUB_SHA" \
            --model-url "$AIFT_MODEL_URL" --model "$AIFT_MODEL_NAME" \
            | tee "$RUNNER_TEMP/aift-aetherion-readiness.json"
      - name: Preserve read-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aift-aetherion-readiness
          path: ${{ runner.temp }}/aift-aetherion-readiness.json
          if-no-files-found: ignore
          retention-days: 1
