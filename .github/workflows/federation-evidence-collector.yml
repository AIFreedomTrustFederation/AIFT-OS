name: Federation Evidence Collector Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Test authenticated artifact collection contract
        run: python -B -m unittest discover -s tests -p 'test_collect_federation_evidence.py' -v
