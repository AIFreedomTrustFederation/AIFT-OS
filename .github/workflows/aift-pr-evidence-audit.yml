name: AIFT Read-Only Federation PR Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/aift-pr-evidence-audit.yml'
      - 'scripts/aift_pr_evidence_audit.py'
      - 'tests/test_aift_pr_evidence_audit.py'
      - 'docs/aift-pr-evidence-audit.md'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Read-only repository selection'
        required: true
        default: all
        type: choice
        options:
          - all
          - AIFreedomTrustFederation/AIFT-OS
          - AIFreedomTrustFederation/www.aifreedomtrust.com
          - AIFreedomTrustFederation/AIFT-Runtime
          - AIFreedomTrustFederation/VPS

permissions:
  contents: read

concurrency:
  group: aift-pr-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Confirm collector and fail-closed contract without network
        run: python3 -B -m unittest discover -s tests -p 'test_aift_pr_evidence_audit.py' -v

  audit:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Check out trusted exact main without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run collector regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_aift_pr_evidence_audit.py' -v
      - name: Audit bounded open PRs without mutations
        env:
          AIFT_AUDIT_TOKEN: ${{ github.token }}
          SELECTED_REPOSITORY: ${{ inputs.repository || 'all' }}
        run: |
          set -euo pipefail
          python3 -B scripts/aift_pr_evidence_audit.py \
            --repository "$SELECTED_REPOSITORY" \
            --max-per-repo 10 \
            --output "$RUNNER_TEMP/aift-pr-evidence.json"
      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aift-pr-evidence
          path: ${{ runner.temp }}/aift-pr-evidence.json
          if-no-files-found: warn
