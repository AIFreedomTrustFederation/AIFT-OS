name: Embodied E1 simulated safety gate
on:
  pull_request:
    paths:
      - 'experiments/embodied/**'
      - '.github/workflows/embodied-e1-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e1-simulation:
    name: E1 deterministic simulation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify tested revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Python version
        run: python3 --version
      - name: Run fail-closed simulator regressions
        run: python3 -m unittest discover -s experiments/embodied -p 'test_*.py' -v
      - name: Run simulation-only demo
        run: python3 experiments/embodied/safety_sim.py
